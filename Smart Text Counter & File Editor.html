<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Text Counter & File Editor</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #eef2f3 0%, #8e9eab 100%);
            --card-bg: #ffffff;
            --text-color: #2d3748;
            --text-muted: #718096;
            --border-color: #e2e8f0;
            --input-bg: #f8fafc;
            --stat-bg: #f7fafc;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --danger-bg: #fee2e2;
            --danger-color: #dc2626;
            --btn-secondary-bg: #edf2f7;
            --btn-secondary-text: #4a5568;
            --btn-secondary-hover: #e2e8f0;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --stat-bg: #0f172a;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
            --danger-bg: #451a1a;
            --danger-color: #f87171;
            --btn-secondary-bg: #334155;
            --btn-secondary-text: #cbd5e1;
            --btn-secondary-hover: #475569;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 920px;
            border-radius: 24px;
            padding: 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            color: var(--text-color);
            font-size: 1.75rem;
            font-weight: 700;
        }

        .top-controls {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn:hover {
            background: var(--btn-secondary-hover);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--stat-bg);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .file-toolbar {
            background: var(--stat-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .file-upload-wrapper input[type="file"] {
            display: none;
        }

        .export-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: 100%;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 220px;
        }

        .input-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            white-space: nowrap;
        }

        input[type="text"], select {
            background: var(--input-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent-color);
        }

        select {
            min-width: 110px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 280px;
            padding: 18px;
            background: var(--input-bg);
            color: var(--text-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.6;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear {
            background: var(--danger-bg);
            color: var(--danger-color);
        }

        .btn-copy {
            background: var(--btn-secondary-bg);
            color: var(--btn-secondary-text);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--text-color);
            color: var(--card-bg);
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            display: none;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 id="txt-title">✨ Đếm Văn Bản & Tập Tin</h1>
            <div class="top-controls">
                <button class="icon-btn" onclick="toggleTheme()" id="btn-theme">🌙 Tối</button>
                <button class="icon-btn" onclick="toggleLang()" id="btn-lang">🌐 EN</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="char-count">0</div>
                <div class="stat-label" id="lbl-chars">Tổng ký tự</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="char-no-space">0</div>
                <div class="stat-label" id="lbl-chars-nospace">Ký tự (không cách)</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="word-count">0</div>
                <div class="stat-label" id="lbl-words">Từ</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="paragraph-count">0</div>
                <div class="stat-label" id="lbl-paragraphs">Đoạn văn</div>
            </div>
        </div>

        <div class="file-toolbar">
            <div class="file-upload-wrapper">
                <label for="file-upload" class="icon-btn" style="cursor: pointer;">
                    📂 <span id="lbl-import">Tải file lên (.txt, .docx, .json, .md, .pdf)</span>
                </label>
                <input type="file" id="file-upload" accept=".txt, .json, .md, .docx, .pdf">
            </div>

            <div class="export-controls">
                <div class="input-group">
                    <label id="lbl-filename">Tên file:</label>
                    <input type="text" id="custom-filename" placeholder="van-ban-cua-toi">
                </div>

                <div class="input-group" style="flex: 0; min-width: auto;">
                    <select id="export-format">
                        <option value="txt" selected>.TXT</option>
                        <option value="docx">.DOCX (Word)</option>
                        <option value="md">.MD</option>
                        <option value="json">.JSON</option>
                        <option value="pdf">.PDF</option>
                    </select>
                </div>

                <button class="btn btn-primary" onclick="downloadFile()">
                    💾 <span id="lbl-download">Tải về</span>
                </button>
            </div>
        </div>

        <textarea id="text-input" placeholder="Nhập hoặc dán văn bản của bạn tại đây..."></textarea>

        <div class="actions">
            <button class="btn btn-clear" onclick="clearText()" id="lbl-clear">🗑️ Xóa tất cả</button>
            <button class="btn btn-copy" onclick="copyText()" id="lbl-copy">📋 Sao chép</button>
        </div>
    </div>

    <footer class="footer">
        © 2026 | © Copyright ATCX. All rights reserved.
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const translations = {
            vi: {
                title: "✨ Đếm Văn Bản & Tập Tin",
                themeDark: "🌙 Tối",
                themeLight: "☀️ Sáng",
                chars: "Tổng ký tự",
                charsNoSpace: "Ký tự (không cách)",
                words: "Từ",
                paragraphs: "Đoạn văn",
                importBtn: "Tải file lên (.txt, .docx, .json, .md, .pdf)",
                filenameLbl: "Tên file:",
                filenamePlaceholder: "van-ban-cua-toi",
                downloadBtn: "Tải về",
                placeholderText: "Nhập hoặc dán văn bản của bạn tại đây...",
                clearBtn: "🗑️ Xóa tất cả",
                copyBtn: "📋 Sao chép",
                reading: "Đang đọc tập tin...",
                readSuccess: "Đã đọc file thành công!",
                readError: "Lỗi khi đọc file!",
                noContent: "Không có nội dung để tải về!",
                copySuccess: "Đã sao chép vào bộ nhớ tạm!",
                exported: "Đã xuất file: "
            },
            en: {
                title: "✨ Text Counter & File Editor",
                themeDark: "🌙 Dark",
                themeLight: "☀️ Light",
                chars: "Total Characters",
                charsNoSpace: "Chars (no space)",
                words: "Words",
                paragraphs: "Paragraphs",
                importBtn: "Upload File (.txt, .docx, .json, .md, .pdf)",
                filenameLbl: "File Name:",
                filenamePlaceholder: "my-document",
                downloadBtn: "Download",
                placeholderText: "Type or paste your text here...",
                clearBtn: "🗑️ Clear All",
                copyBtn: "📋 Copy Text",
                reading: "Reading file...",
                readSuccess: "File read successfully!",
                readError: "Error reading file!",
                noContent: "No content to download!",
                copySuccess: "Copied to clipboard!",
                exported: "Exported file: "
            }
        };

        let currentLang = 'vi';
        let currentTheme = 'light';

        const textInput = document.getElementById('text-input');
        const fileUpload = document.getElementById('file-upload');
        const customFilenameInput = document.getElementById('custom-filename');
        const toast = document.getElementById('toast');

        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('btn-theme').innerText = currentTheme === 'light' 
                ? translations[currentLang].themeDark 
                : translations[currentLang].themeLight;
        }

        function toggleLang() {
            currentLang = currentLang === 'vi' ? 'en' : 'vi';
            document.getElementById('btn-lang').innerText = currentLang === 'vi' ? '🌐 EN' : '🌐 VI';
            applyTranslations();
        }

        function applyTranslations() {
            const t = translations[currentLang];
            document.getElementById('txt-title').innerText = t.title;
            document.getElementById('btn-theme').innerText = currentTheme === 'light' ? t.themeDark : t.themeLight;
            document.getElementById('lbl-chars').innerText = t.chars;
            document.getElementById('lbl-chars-nospace').innerText = t.charsNoSpace;
            document.getElementById('lbl-words').innerText = t.words;
            document.getElementById('lbl-paragraphs').innerText = t.paragraphs;
            document.getElementById('lbl-import').innerText = t.importBtn;
            document.getElementById('lbl-filename').innerText = t.filenameLbl;
            customFilenameInput.placeholder = t.filenamePlaceholder;
            document.getElementById('lbl-download').innerText = t.downloadBtn;
            textInput.placeholder = t.placeholderText;
            document.getElementById('lbl-clear').innerText = t.clearBtn;
            document.getElementById('lbl-copy').innerText = t.copyBtn;
        }

        function updateStats() {
            const text = textInput.value;
            document.getElementById('char-count').innerText = text.length;
            document.getElementById('char-no-space').innerText = text.replace(/\s/g, '').length;

            const trimmedText = text.trim();
            if (trimmedText === '') {
                document.getElementById('word-count').innerText = 0;
                document.getElementById('paragraph-count').innerText = 0;
            } else {
                document.getElementById('word-count').innerText = trimmedText.split(/\s+/).length;
                document.getElementById('paragraph-count').innerText = text.split(/\n+/).filter(p => p.trim().length > 0).length;
            }
        }

        textInput.addEventListener('input', updateStats);

        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const ext = file.name.split('.').pop().toLowerCase();
            showToast(translations[currentLang].reading);

            const nameWithoutExt = file.name.substring(0, file.name.lastIndexOf('.'));
            customFilenameInput.value = nameWithoutExt;

            try {
                if (ext === 'txt' || ext === 'md') {
                    textInput.value = await file.text();
                } else if (ext === 'json') {
                    const text = await file.text();
                    try {
                        textInput.value = JSON.stringify(JSON.parse(text), null, 2);
                    } catch {
                        textInput.value = text;
                    }
                } else if (ext === 'docx') {
                    const arrayBuffer = await file.arrayBuffer();
                    const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                    textInput.value = result.value;
                } else if (ext === 'pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const content = await page.getTextContent();
                        fullText += content.items.map(item => item.str).join(' ') + '\n\n';
                    }
                    textInput.value = fullText.trim();
                }
                updateStats();
                showToast(translations[currentLang].readSuccess);
            } catch (err) {
                console.error(err);
                showToast(translations[currentLang].readError);
            }
            fileUpload.value = '';
        });

        function downloadFile() {
            const text = textInput.value;
            if (!text) {
                showToast(translations[currentLang].noContent);
                return;
            }

            const format = document.getElementById('export-format').value;
            
            let rawFilename = customFilenameInput.value.trim();
            if (!rawFilename) {
                rawFilename = currentLang === 'vi' ? 'van-ban' : 'document';
            }
            
            const safeFilename = rawFilename.replace(/[/\\\\?%*:|"<>]/g, '');
            const finalFilename = `${safeFilename}.${format}`;

            if (format === 'docx') {
                const htmlContent = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${text.replace(/\n/g, '<br>')}</body></html>`;
                const converted = htmlDocx.asBlob(htmlContent);
                saveBlobAsFile(converted, finalFilename);
            } else if (format === 'pdf') {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const splitText = doc.splitTextToSize(text, 180);
                doc.text(splitText, 10, 10);
                doc.save(finalFilename);
            } else if (format === 'json') {
                let content = text;
                try {
                    JSON.parse(text);
                } catch {
                    content = JSON.stringify({ content: text }, null, 2);
                }
                saveAsFile(content, finalFilename, 'application/json');
            } else {
                const mimeType = format === 'md' ? 'text/markdown' : 'text/plain';
                saveAsFile(text, finalFilename, mimeType);
            }

            showToast(translations[currentLang].exported + finalFilename);
        }

        function saveAsFile(content, filename, mimeType) {
            const blob = new Blob([content], { type: `${mimeType};charset=utf-8` });
            saveBlobAsFile(blob, filename);
        }

        function saveBlobAsFile(blob, filename) {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function clearText() {
            textInput.value = '';
            customFilenameInput.value = '';
            updateStats();
            textInput.focus();
        }

        function copyText() {
            if (!textInput.value) return;
            navigator.clipboard.writeText(textInput.value).then(() => {
                showToast(translations[currentLang].copySuccess);
            });
        }

        function showToast(message) {
            toast.innerText = message;
            toast.style.display = 'block';
            setTimeout(() => {
                toast.style.display = 'none';
            }, 2500);
        }
    </script>
</body>
</html>
